name: CI/CD Pipeline

on:
  push:
    branches: [dev]

jobs:
  # This runs when code is pushed to dev
  dev-validation:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
      
    - name: Display branch info
      run: |
        echo "✅ Development branch validation passed"
        echo "Current branch: ${{ github.ref }}"
        echo "Repository: ${{ github.repository }}"

  # This creates PR from dev→uat automatically
  create-uat-pr:
    needs: dev-validation
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        fetch-depth: 0
    
    - name: Create PR to UAT
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
        # Check if PR already exists
        PR_EXISTS=$(gh pr list --base uat --head dev --state open | wc -l)
        if [ $PR_EXISTS -eq 0 ]; then
          echo "Creating PR from dev to uat"
          gh pr create \
            --base uat \
            --head dev \
            --title "Promote changes from Dev to UAT - ${{ github.sha }}" \
            --body "Automated PR: Changes ready for UAT testing. Please review and merge."
        else
          echo "PR from dev to uat already exists"
        fi
      env:
        GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}